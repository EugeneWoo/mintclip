name: E2E Tests (Staging)

on:
  workflow_run:
    workflows: ["CI"]
    branches: [staging]
    types: [completed]

# Never run two E2E jobs at once: they share one staging backend + DB.
concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e-staging:
    name: E2E Tests (Staging)
    # Only run when main CI passed — no point testing a broken deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # The commit that CI just passed (not whatever staging points at now), full
          # history so the wait step can compare commits.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-e2e-${{ hashFiles('backend/requirements*.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install httpx

      - name: Wait for Railway staging deploy
        env:
          STAGING_BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$STAGING_BACKEND_URL" ]; then
            echo "::error::STAGING_BACKEND_URL secret is not set - refusing to pass (and auto-merge) without testing"
            exit 1
          fi
          # Railway only redeploys when backend/** changes, so the running build must
          # contain the newest commit that touched backend/ (not necessarily HEAD).
          NEED=$(git log -1 --format=%H "$HEAD_SHA" -- backend)
          echo "Need staging to be running a build that includes ${NEED:-<no backend commit>}"
          for i in $(seq 1 40); do
            RUNNING=$(curl -sf "$STAGING_BACKEND_URL/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit') or '')" 2>/dev/null || true)
            if [ -n "$RUNNING" ] && git cat-file -e "$RUNNING^{commit}" 2>/dev/null && git merge-base --is-ancestor "$NEED" "$RUNNING"; then
              echo "Staging is running ${RUNNING} (attempt $i)"
              exit 0
            fi
            echo "Staging running '${RUNNING:-unknown}' - not ready (attempt $i/40), waiting 15s..."
            sleep 15
          done
          echo "::error::Staging never deployed ${NEED} within 10 minutes"
          exit 1

      - name: Run E2E tests
        env:
          CI: "true"
          STAGING_BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        run: |
          if [ -z "$STAGING_BACKEND_URL" ] || [ -z "$TEST_ACCOUNT_EMAIL" ] || [ -z "$TEST_ACCOUNT_PASSWORD" ]; then
            echo "::error::STAGING_BACKEND_URL / TEST_ACCOUNT_EMAIL / TEST_ACCOUNT_PASSWORD must all be set - refusing to pass without testing"
            exit 1
          fi
          pytest tests/e2e/ -v --tb=short -m "not slow" -rs

      - name: Auto-merge staging → main
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ github.workspace }}
          PR=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then
            if gh pr merge "$PR" --merge --subject "chore: merge staging → main (e2e passed)"; then
              echo "Merged PR #$PR"
            elif [ "$(gh pr view "$PR" --json state --jq .state)" = "MERGED" ]; then
              echo "PR #$PR was already merged by a concurrent run — nothing to do"
            else
              echo "Failed to merge PR #$PR" && exit 1
            fi
          else
            echo "No open staging→main PR found — skipping auto-merge"
          fi
